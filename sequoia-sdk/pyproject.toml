[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sequoia-sdk"
version = "0.1.0"
description = "Python SDK for the SiliconCentric Sequoia IV&V platform (HalService client)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "SiliconCentric IV&V" }]
keywords = ["ivv", "sequoia", "hal", "grpc", "embedded"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Hardware",
]
dependencies = [
  "grpcio>=1.51,<2.0",
  "protobuf>=5.26",
]

[project.optional-dependencies]
dev = [
  "grpcio-tools>=1.51,<2.0",
  "mypy-protobuf>=3.4",
  "pytest>=8.0",
  "pytest-cov>=4.0",
  "mypy>=1.8",
  "ruff>=0.4",
  "pyyaml>=6.0",
  "types-protobuf",
  "types-grpcio",
]

[project.urls]
Homepage = "https://siliconcentric.example/sequoia-sdk"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sequoia_sdk*"]

[tool.setuptools.package-data]
"sequoia_sdk._proto" = ["**/*.pyi"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/sequoia_sdk/_proto", "src/sequoia_sdk/types"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/sequoia_sdk"]
exclude = [
  "^src/sequoia_sdk/_proto/",
  "^src/sequoia_sdk/types/",
]

[[tool.mypy.overrides]]
module = ["grpc", "grpc.*", "google.protobuf.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sequoia_sdk._proto", "sequoia_sdk._proto.*", "sequoia_sdk.types", "sequoia_sdk.types.*"]
ignore_errors = true
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
